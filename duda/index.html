<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Para Você ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Você consegue clicar? 👀❤️</h1>

    <button id="botaoFujao">
        CLICA EM MIM
    </button>

    <div id="surpresa">

        <h1>
            ❤️ Para você ❤️
        </h1>

        <p>
            Depois de tanto fugir,
            você finalmente conseguiu... ❤️
        </p>

        <img
            src="foto.jpg"
            alt="Nossa foto"
        >

        <audio
            id="musica"
            controls
            preload="auto"
        >
            <source
                src="musica.mp3"
                type="audio/mpeg"
            >
        </audio>

    </div>

    <script src="script.js"></script>

</body>

</html>
